# Vérifications lancées à chaque poussée et sur chaque demande de fusion (pull request), y compris celles qui viennent
# d'un fork : le dépôt est public. Rien ici ne lit de secret du dépôt ni n'a de droit d'écriture ; le code proposé
# s'exécute avec un jeton en lecture seule, jamais avec les droits du dépôt. Vérifié par scripts/chaine-ci.test.ts.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # 24 = version incluse dans les paquets téléchargeables
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # sur une demande de fusion, gitleaks lit la liste de ses commits ; aucun droit d'écriture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # pas de commentaire sur la demande : le job n'a que des droits de lecture
