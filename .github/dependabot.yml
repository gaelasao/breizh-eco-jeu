# Mises à jour proposées par Dependabot, jamais avant 7 jours de quarantaine (14 pour une version majeure) : une
# version piégée est en général repérée et retirée du registre en 24 à 72 h. Même règle pour une mise à jour faite à
# la main (docs/conformite/SECURITE.md). Vérifié par scripts/chaine-ci.test.ts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Mises à jour de version en pause (13 novembre 2026) : chaque proposition lançait la CI et ses e-mails d'échec.
    # Les correctifs de sécurité de Dependabot ne sont pas concernés. Remettre une limite (5) pour reprendre.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Mises à jour de version en pause (13 novembre 2026) : chaque proposition lançait la CI et ses e-mails d'échec.
    # Les correctifs de sécurité de Dependabot ne sont pas concernés. Remettre une limite (5) pour reprendre.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
